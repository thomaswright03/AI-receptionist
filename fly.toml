# Always-warm: live-call tool requests must never wait on a cold start.
app = "ai-receptionist"
primary_region = "phx"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"

# State (messages, PAUSE flag, booking keys, opt-outs) lives here. Create once: fly volumes create receptionist_data --region phx --size 1
# Daily snapshots are on by default; keep 14 days.
[mounts]
  source = "receptionist_data"
  destination = "/data"
  snapshot_retention = 14
